<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Linked Cards overview screenshot mock</title>
  <desc id="desc">A Home Assistant style dashboard showing one master card template reused by living room, bedroom and kitchen linked cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b3b55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" fill="#e9f3ff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Linked Cards</text>
  <text x="64" y="108" fill="#a8c7dc" font-family="Inter, Arial, sans-serif" font-size="18">One master Lovelace card, many linked dashboard instances.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="360" height="420" rx="22" fill="#162234" stroke="#2d4962"/>
    <text x="92" y="194" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Master template</text>
    <text x="92" y="224" fill="#8fb3c8" font-family="Inter, Arial, sans-serif" font-size="14">room-summary</text>
    <rect x="92" y="252" width="304" height="236" rx="14" fill="#0f1724" stroke="#385773"/>
    <text x="114" y="286" fill="#7dd3fc" font-family="Menlo, Consolas, monospace" font-size="14">{</text>
    <text x="130" y="316" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="14">"type": "grid",</text>
    <text x="130" y="346" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="14">"title": "${area}",</text>
    <text x="130" y="376" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="14">"cards": [</text>
    <text x="148" y="406" fill="#fbbf24" font-family="Menlo, Consolas, monospace" font-size="14">"${light}"</text>
    <text x="148" y="436" fill="#fbbf24" font-family="Menlo, Consolas, monospace" font-size="14">"${climate}"</text>
    <text x="130" y="466" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="14">]</text>
    <text x="114" y="492" fill="#7dd3fc" font-family="Menlo, Consolas, monospace" font-size="14">}</text>
    <rect x="92" y="514" width="304" height="36" rx="10" fill="#0284c7"/>
    <text x="170" y="538" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Edit once in manager</text>
  </g>

  <path d="M450 360 C510 360 530 240 600 240" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M450 360 C520 360 530 360 600 360" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M450 360 C510 360 530 500 600 500" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="620" y="150" width="270" height="180" rx="20" fill="#f8fafc"/>
    <text x="646" y="190" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Living Room</text>
    <rect x="646" y="214" width="95" height="76" rx="14" fill="#e0f2fe"/>
    <text x="667" y="258" fill="#0369a1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Lights</text>
    <rect x="764" y="214" width="95" height="76" rx="14" fill="#fef3c7"/>
    <text x="778" y="258" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Climate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="370" width="270" height="180" rx="20" fill="#f8fafc"/>
    <text x="646" y="410" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Bedroom</text>
    <rect x="646" y="434" width="95" height="76" rx="14" fill="#e0f2fe"/>
    <text x="667" y="478" fill="#0369a1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Lights</text>
    <rect x="764" y="434" width="95" height="76" rx="14" fill="#fef3c7"/>
    <text x="778" y="478" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Climate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="944" y="260" width="270" height="180" rx="20" fill="#f8fafc"/>
    <text x="970" y="300" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Kitchen</text>
    <rect x="970" y="324" width="95" height="76" rx="14" fill="#e0f2fe"/>
    <text x="991" y="368" fill="#0369a1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Lights</text>
    <rect x="1088" y="324" width="95" height="76" rx="14" fill="#fef3c7"/>
    <text x="1102" y="368" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Climate</text>
  </g>

  <text x="620" y="610" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Linked instances only store template id + variables</text>
  <text x="620" y="640" fill="#a8c7dc" font-family="Inter, Arial, sans-serif" font-size="15">No more editing the same Lovelace card in every dashboard.</text>
</svg>
